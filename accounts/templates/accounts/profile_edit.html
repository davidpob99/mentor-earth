{% extends "base.html" %}
{% block title %}Edit profile · Mentoring{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <div class="actions">
      <button class="btn primary" type="submit">Save</button>
      <a class="btn" href="{% url 'mentoring:profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
